services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devflow-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
    ports:
      - "5432:5432"
    volumes:
      - devflow_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devflow} -d ${POSTGRES_DB:-devflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devflow-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    profiles:
      - optional

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: devflow-ai-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - devflow_etcd_data:/etcd

  minio:
    # MinIO 已停止在 Docker Hub / quay.io 免费分发官方镜像，这里改用 Bitnami 的兼容镜像。
    # 如果需要官方镜像，可自行构建或改用其他 S3 兼容存储。
    image: bitnamilegacy/minio:latest
    container_name: devflow-ai-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - devflow_minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 12

  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: devflow-ai-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

volumes:
  devflow_postgres_data:
  devflow_etcd_data:
  devflow_minio_data:
